import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.keyflux'
    compileSdk 37

    defaultConfig {
        applicationId "com.keyflux"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.3.0"
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.github.lingqiqi5211.meowui:meowui-xposed:0.1.5'
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha26'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    compileOnly files('libs/api-82.jar')
    compileOnly 'io.github.libxposed:api:101.0.1'
    implementation 'org.luckypray:dexkit:2.2.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation files('libs/api-82.jar')
    testImplementation 'io.github.libxposed:api:101.0.1'
}
